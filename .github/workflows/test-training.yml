name: Testar pipeline de treinamento Mikael AI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "training/**"
      - ".github/workflows/train-mikael-model.yml"
      - ".github/workflows/test-training.yml"
  pull_request:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/train-mikael-model.yml"
      - ".github/workflows/test-training.yml"

permissions:
  contents: read

jobs:
  test-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run architecture and MKAI export tests
        run: python -m unittest discover -s training/tests -v
