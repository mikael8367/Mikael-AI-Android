name: Treinar modelo próprio Mikael AI

on:
  workflow_dispatch:
    inputs:
      corpus_path:
        description: "Caminho do corpus UTF-8 dentro do repositório"
        required: true
        default: "training/corpus.txt"
        type: string
      steps:
        description: "Quantidade de passos de treinamento"
        required: true
        default: "1200"
        type: string
      sequence_length:
        description: "Contexto do modelo (precisa ser compatível com a configuração do app)"
        required: true
        default: "512"
        type: choice
        options:
          - "512"
          - "1024"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Run trainer unit tests
        run: python -m unittest discover -s training/tests -v

      - name: Validate training corpus
        run: |
          test -f "${{ inputs.corpus_path }}" || { echo "Corpus não encontrado: ${{ inputs.corpus_path }}"; exit 1; }
          python -c "from pathlib import Path; p=Path('${{ inputs.corpus_path }}'); b=p.read_bytes(); b.decode('utf-8'); print(f'Corpus UTF-8 válido: {len(b)} bytes')"

      - name: Run trainer and export original MKAI weights
        run: |
          python training/train_mikai.py \
            --corpus "${{ inputs.corpus_path }}" \
            --output artifacts/mikael-base.mkai \
            --steps "${{ inputs.steps }}" \
            --seq-len "${{ inputs.sequence_length }}" \
            --batch-size 4 \
            --dim 64 \
            --layers 2 \
            --heads 4 \
            --ffn 128

      - name: Upload trained MKAI model
        uses: actions/upload-artifact@v4
        with:
          name: mikael-ai-original-mkai-v1
          path: artifacts/mikael-base.mkai
          if-no-files-found: error
          retention-days: 30
