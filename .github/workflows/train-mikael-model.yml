name: Treinar modelo próprio Mikael AI

on:
  push:
    branches: ["fix/**"]
    paths:
      - "training/corpus.txt"
      - "training/train_mikai.py"
  workflow_dispatch:
    inputs:
      corpus_path:
        description: "Caminho do corpus UTF-8 dentro do repositório"
        required: true
        default: "training/corpus.txt"
        type: string
      steps:
        description: "Quantidade de passos de treinamento"
        required: true
        default: "2500"
        type: string
      sequence_length:
        description: "Contexto do modelo (precisa ser compatível com a configuração do app)"
        required: true
        default: "512"
        type: choice
        options:
          - "512"
          - "1024"

permissions:
  contents: write

concurrency:
  group: mikael-ai-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Run trainer unit tests
        run: python -m unittest discover -s training/tests -v

      - name: Validate training corpus
        env:
          CORPUS_PATH: ${{ inputs.corpus_path || 'training/corpus.txt' }}
        run: |
          test -f "$CORPUS_PATH" || { echo "Corpus não encontrado."; exit 1; }
          CORPUS_REAL="$(realpath "$CORPUS_PATH")"
          case "$CORPUS_REAL" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "O corpus precisa estar dentro do repositório."; exit 1 ;;
          esac
          export CORPUS_REAL
          python -c 'import os; from pathlib import Path; p=Path(os.environ["CORPUS_REAL"]); b=p.read_bytes(); b.decode("utf-8", errors="strict"); print(f"Corpus UTF-8 válido: {len(b)} bytes")'

      - name: Run trainer and export original MKAI weights
        env:
          CORPUS_PATH: ${{ inputs.corpus_path || 'training/corpus.txt' }}
          TRAIN_STEPS: ${{ inputs.steps || '2500' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '512' }}
        run: |
          python training/train_mikai.py \
            --corpus "$CORPUS_PATH" \
            --output artifacts/mikael-base.mkai \
            --steps "$TRAIN_STEPS" \
            --seq-len "$SEQUENCE_LENGTH" \
            --batch-size 4 \
            --dim 64 \
            --layers 2 \
            --heads 4 \
            --ffn 128

      - name: Upload trained MKAI model
        uses: actions/upload-artifact@v4
        with:
          name: mikael-ai-original-mkai-v1
          path: artifacts/mikael-base.mkai
          if-no-files-found: error
          retention-days: 30

      - name: Publish checkpoint for in-app installation
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mikael-ai-model-v1
          name: Mikael AI — checkpoint autoral MKAI v1
          body: |
            Checkpoint gerado pelo pipeline de treinamento autoral Mikael AI.
            Baixe e instale pelo catálogo do aplicativo Mikael AI Android.
            Modelo experimental; qualidade depende do corpus de treinamento utilizado.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: artifacts/mikael-base.mkai
